
# ==========================================
# LINK SHORTENER CONFIGURATION
# ==========================================

# Время жизни короткой ссылки в секундах
# 86400 секунд = 24 часа
link.ttl.seconds=10

# Максимально допустимый лимит переходов
link.max-clicks=1000

# Длина короткого кода
link.code.length=10

# Интервал автоматической очистки в секундах
link.cleanup.interval.seconds=60


# ==========================================
# DATA STORAGE
# ==========================================

# Путь к файлу пользователей
storage.users-file=data/users.json

# Путь к файлу коротких ссылок
storage.links-file=data/links.json
