name: Link Shortener CI/CD

# События, запускающие workflow
on:
  push:
  pull_request:
  workflow_dispatch:

# Минимальные права для чтения репозитория
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test and upload artifact
    runs-on: ubuntu-latest

    steps:
      # 1. Получаем исходный код репозитория
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Устанавливаем Java 17 и включаем кэш Maven
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Разрешаем запуск Maven Wrapper
      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      # 4. Собираем проект
      - name: Build project
        run: ./mvnw --batch-mode --no-transfer-progress clean package

      # 5. Запускаем проверку сохранения данных
      - name: Run persistence smoke test
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          -Dexec.mainClass=com.linkshortener.test.PersistenceSmokeTest
          -Dexec.classpathScope=test
          org.codehaus.mojo:exec-maven-plugin:3.7.0:java

      # 6. Сохраняем собранный JAR как артефакт
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: link-shortener-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14